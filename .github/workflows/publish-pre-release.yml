---
name: Publish Pre-Release

on:
  release:
    types:
      - prereleased

permissions: {}

jobs:
  publish-chrome-pre-release:
    name: Publish Pre-Release to Chrome Web Store
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:chrome:pre-release

      - run: gh release upload "${RELEASE_TAG}" "$(ls .output/*-chrome-pre-release.zip)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}

      - run: |
          pnpm wxt submit \
            --chrome-zip .output/*-chrome-pre-release.zip
        env:
          CHROME_EXTENSION_ID: adgcdimdkkaddeopcabokepmaihfhklb
          CHROME_API_VERSION: v2
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_PUBLISH_TYPE: DEFAULT_PUBLISH
          CHROME_SKIP_SUBMIT_REVIEW: false
          CHROME_CANCEL_PENDING: true
